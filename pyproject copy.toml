[build-system]
requires = ["hatchling>=1.8.0"]
build-backend = "hatchling.build"

[project]
name = "autodata"
version = "0.1.0"
description = "A multi-agent system for crawling data from open web sources"
authors = [
    {name = "Tianyi-Billy-Ma", email = "matianyibilly@gmail.com"}
]
maintainers = [
    {name = "Tianyi-Billy-Ma", email = "matianyibilly@gmail.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: XML",
]
keywords = ["multi-agent", "data-extraction", "automation", "scraping"]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "selenium>=4.15.0",
    "scrapy>=2.11.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "asyncio-mqtt>=0.16.0",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "toml>=0.10.2",
    "jsonschema>=4.20.0",
    "lxml>=4.9.0",
    "cssselect>=1.2.0",
    "parsel>=1.8.0",
    "itemadapter>=0.8.0",
    "w3lib>=2.1.0",
    "twisted>=22.10.0",
    "cryptography>=41.0.0",
    "certifi>=2023.7.0",
    "charset-normalizer>=3.3.0",
    "idna>=3.4",
    "urllib3>=2.0.0",
    "easydict>=1.13",
    "langchain>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-anthropic>=1.0.0,<2.0.0",
    "langchain-google-genai>=3.0.0,<4.0.0",
    "langgraph>=0.6.6",
    "docker>=7.1.0",
    "browser-use>=0.8.0",
    "langchain-community>=0.4.0,<0.5.0",
    "grandalf>=0.8",
    "websockets>=15.0",
    "pillow>=11.3.0",
    "datasets>=4.1.1",
    "huggingface-hub>=0.36.0,<1.0.0",
    "omegaconf>=2.3.0",
    "transformers>=4.44.0,<5.0.0",
    "vulture>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.3.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "tox>=4.6.0",
    "coverage>=7.3.0",
    "safety>=2.3.0",
    "bandit>=1.7.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]
docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "myst-parser>=2.0.0",
    "sphinx-copybutton>=0.5.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.3.0",
    "coverage>=7.3.0",
    "responses>=0.23.0",
    "httpx>=0.25.0",
    "factory-boy>=3.3.0",
    "faker>=19.0.0",
]
eval = [
    "evaluate>=0.4.0",
    "gradio>=3.50.0",
]
full = [
    "autodata[dev,docs,test,eval]"
]

[project.urls]
Homepage = "https://github.com/Tianyi-Billy-Ma/AutoData_DEV"

[tool.hatch.build.targets.wheel]
packages = ["autodata"]

[tool.hatch.build.targets.sdist]
include = [
    "autodata",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
Documentation = "https://autodata.readthedocs.io"
Repository = "https://github.com/Tianyi-Billy-Ma/AutoData_DEV.git"
"Bug Tracker" = "https://github.com/Tianyi-Billy-Ma/AutoData_DEV/issues"
"Changelog" = "https://github.com/Tianyi-Billy-Ma/AutoData_DEV/blob/main/CHANGELOG.md"
"Contributing" = "https://github.com/Tianyi-Billy-Ma/AutoData_DEV/blob/main/CONTRIBUTING.md"

[project.scripts]
autodata = "autodata.cli:main"
autodata-checkpoint = "autodata.checkpoint:main"



[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011", "S101", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["autodata"]

[tool.black]
target-version = ['py311']
line-length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*", "easydict.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "agent: marks tests related to agent functionality",
    "tools: marks tests related to tool functionality",
    "evaluation: marks tests related to evaluation functionality",
    "component: marks Phase 004 component suites",
    "hypergraph: marks Phase 004 hypergraph validation suites",
]

[tool.coverage.run]
source = ["autodata"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/env/*",
    "*/.env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101", "B601"]

[tool.safety]
output = "text"
full-report = true

# UV configuration
[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.3.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "tox>=4.6.0",
    "coverage>=7.3.0",
    "safety>=2.3.0",
    "bandit>=1.7.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]
